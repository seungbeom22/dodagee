<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>두더지 잡기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #ffffff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }

  #game-wrap {
    width: 100%;
    max-width: 420px;
  }

  h1 {
    text-align: center;
    font-size: 22px;
    font-weight: 600;
    color: #1a1a18;
    margin-bottom: 1.25rem;
    letter-spacing: -0.01em;
  }

  #hud {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .stat {
    flex: 1;
    background: #f8f7ff;
    border: 1px solid #e2e0f0;
    border-radius: 10px;
    padding: 10px 14px;
  }

  .stat .label {
    font-size: 11px;
    color: #888780;
    margin-bottom: 2px;
  }

  .stat .val {
    font-size: 22px;
    font-weight: 600;
    color: #1a1a18;
    line-height: 1;
  }

  .stat .val.accent { color: #185fa5; }
  .stat .val.danger { color: #a32d2d; }
  .stat .val.level  { color: #7c3aed; }

  #start-btn {
    padding: 10px 18px;
    border-radius: 10px;
    border: 1px solid #c8c6be;
    background: #f8f7ff;
    color: #1a1a18;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.1s, transform 0.1s;
  }

  #start-btn:hover:not(:disabled) { background: #eeecff; }
  #start-btn:active:not(:disabled) { transform: scale(0.97); }
  #start-btn:disabled { opacity: 0.5; cursor: default; }

  /* 경험치 바 */
  #exp-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }

  #exp-label {
    font-size: 11px;
    color: #7c3aed;
    font-weight: 600;
    white-space: nowrap;
    min-width: 48px;
  }

  #exp-bar-bg {
    flex: 1;
    height: 8px;
    background: #ede9ff;
    border-radius: 4px;
    overflow: hidden;
  }

  #exp-bar {
    height: 100%;
    background: #7c3aed;
    border-radius: 4px;
    transition: width 0.3s ease;
    width: 0%;
  }

  #exp-text {
    font-size: 11px;
    color: #7c3aed;
    font-weight: 600;
    white-space: nowrap;
    min-width: 52px;
    text-align: right;
  }

  #grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 10px;
  }

  .hole {
    aspect-ratio: 1;
    background: #f8f7ff;
    border: 1px solid #e2e0f0;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.6rem;
    cursor: default;
    user-select: none;
    transition: background 0.08s;
    position: relative;
    overflow: hidden;
  }

  .hole.active { cursor: pointer; }
  .hole.active:hover { background: #faeeda; }
  .hole.hit { background: #eaf3de; }
  .hole.miss { background: #fcebeb; }

  .mole-emoji { display: block; transition: transform 0.1s; }

  .hole.active .mole-emoji {
    animation: pop 0.18s ease-out;
  }

  @keyframes pop {
    0%   { transform: scale(0.4) translateY(20px); opacity: 0; }
    70%  { transform: scale(1.15); }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }

  .score-pop {
    position: absolute;
    top: 8px;
    right: 10px;
    font-size: 16px;
    font-weight: 600;
    color: #3b6d11;
    pointer-events: none;
    animation: floatUp 0.6s ease-out forwards;
  }

  .exp-pop {
    position: absolute;
    bottom: 8px;
    left: 10px;
    font-size: 13px;
    font-weight: 600;
    color: #7c3aed;
    pointer-events: none;
    animation: floatUp 0.6s ease-out forwards;
  }

  @keyframes floatUp {
    0%   { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-24px); }
  }

  /* 레벨업 토스트 */
  #levelup-toast {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    background: #7c3aed;
    color: #fff;
    font-size: 20px;
    font-weight: 700;
    padding: 18px 32px;
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(124,58,237,0.35);
    z-index: 100;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
  }
  #levelup-toast.show {
    display: block;
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
    animation: toastAnim 1.2s ease forwards;
  }
  @keyframes toastAnim {
    0%   { opacity: 0; transform: translate(-50%, -60%) scale(0.85); }
    15%  { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
    25%  { transform: translate(-50%, -50%) scale(1); }
    75%  { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -44%) scale(0.95); }
  }

  #result-bar {
    background: #f8f7ff;
    border: 1px solid #e2e0f0;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 14px;
    color: #5f5e5a;
    text-align: center;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #result-bar strong { color: #1a1a18; }

  @media (max-width: 360px) {
    .hole { font-size: 2rem; border-radius: 10px; }
    #hud { gap: 7px; }
    .stat .val { font-size: 18px; }
  }
</style>
</head>
<body>

<div id="game-wrap">
  <h1>🔨 두더지 잡기</h1>

  <div id="hud">
    <div class="stat">
      <div class="label">점수</div>
      <div class="val accent" id="score">0</div>
    </div>
    <div class="stat">
      <div class="label">콤보</div>
      <div class="val" id="combo">x1</div>
    </div>
    <div class="stat">
      <div class="label">레벨</div>
      <div class="val level" id="level-display">1</div>
    </div>
    <button id="start-btn">시작</button>
  </div>

  <!-- 경험치 바 -->
  <div id="exp-wrap">
    <span id="exp-label">Lv.1</span>
    <div id="exp-bar-bg"><div id="exp-bar"></div></div>
    <span id="exp-text">0 / 30</span>
  </div>

  <div id="grid">
    <div class="hole" data-i="0"><span class="mole-emoji">🕳️</span></div>
    <div class="hole" data-i="1"><span class="mole-emoji">🕳️</span></div>
    <div class="hole" data-i="2"><span class="mole-emoji">🕳️</span></div>
    <div class="hole" data-i="3"><span class="mole-emoji">🕳️</span></div>
    <div class="hole" data-i="4"><span class="mole-emoji">🕳️</span></div>
    <div class="hole" data-i="5"><span class="mole-emoji">🕳️</span></div>
    <div class="hole" data-i="6"><span class="mole-emoji">🕳️</span></div>
    <div class="hole" data-i="7"><span class="mole-emoji">🕳️</span></div>
    <div class="hole" data-i="8"><span class="mole-emoji">🕳️</span></div>
  </div>

  <div id="result-bar">시작 버튼을 눌러서 두더지를 잡아라! 🔨</div>
</div>

<div id="levelup-toast">⭐ 레벨 업!</div>

<script>
const TOTAL_TIME  = 30;
const BASE_EXP    = 30;   // 1레벨 → 2레벨 필요 경험치
const EXP_STEP    = 30;   // 레벨마다 30씩 증가
const EXP_PER_HIT = 2;    // 두더지 잡을 때마다 경험치 2
const MAX_LEVEL   = 20;   // 최대 레벨

// 레벨별 두더지 체류 시간(dur)과 다음 소환 간격(interval)
// 레벨 1: 체류 700~1400ms, 간격 300~700ms
// 레벨 20: 체류 200~400ms, 간격 80~180ms
function getSpeed() {
  const t = (level - 1) / (MAX_LEVEL - 1); // 0.0(Lv1) ~ 1.0(Lv20)
  const durMin  = Math.round(700  - t * 500);   // 700 → 200
  const durMax  = Math.round(1400 - t * 1000);  // 1400 → 400
  const intMin  = Math.round(300  - t * 220);   // 300 → 80
  const intMax  = Math.round(700  - t * 520);   // 700 → 180
  return { durMin, durMax, intMin, intMax };
}

// ── 효과음 (Web Audio API, 파일 없이 합성) ──────────────────
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

// 띠용~ : 맞췄을 때, 위로 튕겨오르는 코믹한 소리
function playHitSound() {
  const ctx = getAudioCtx();
  const now = ctx.currentTime;

  const osc  = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(220, now);
  osc.frequency.exponentialRampToValueAtTime(880, now + 0.12);
  osc.frequency.exponentialRampToValueAtTime(660, now + 0.22);

  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.35, now + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);

  osc.connect(gain).connect(ctx.destination);
  osc.start(now);
  osc.stop(now + 0.3);
}

// 띡~ : 헛다리 짚었을 때, 짧고 둔탁한 소리
function playMissSound() {
  const ctx = getAudioCtx();
  const now = ctx.currentTime;

  const osc  = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(180, now);
  osc.frequency.exponentialRampToValueAtTime(110, now + 0.09);

  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.25, now + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.1);

  osc.connect(gain).connect(ctx.destination);
  osc.start(now);
  osc.stop(now + 0.11);
}

const holes       = Array.from(document.querySelectorAll('.hole'));
const scoreEl     = document.getElementById('score');
const comboEl     = document.getElementById('combo');
const resultEl    = document.getElementById('result-bar');
const startBtn    = document.getElementById('start-btn');
const levelDisp   = document.getElementById('level-display');
const expLabel    = document.getElementById('exp-label');
const expBar      = document.getElementById('exp-bar');
const expText     = document.getElementById('exp-text');
const toast       = document.getElementById('levelup-toast');

// ── 레벨/경험치 상태 (영구 저장) ──────────────────────────
let level   = parseInt(localStorage.getItem('mole_level'))   || 1;
let exp     = parseInt(localStorage.getItem('mole_exp'))     || 0;
let highScore = parseInt(localStorage.getItem('mole_high'))  || 0;

// 현재 레벨에서 다음 레벨까지 필요한 경험치
// 1→2: 30, 2→3: 60, 3→4: 90, ...
function expNeeded(lv) {
  return BASE_EXP + (lv - 1) * EXP_STEP;
}

function saveProgress() {
  localStorage.setItem('mole_level', level);
  localStorage.setItem('mole_exp',   exp);
  localStorage.setItem('mole_high',  highScore);
}

function updateExpUI() {
  const needed = expNeeded(level);
  const pct    = Math.min(exp / needed * 100, 100);
  expLabel.textContent  = 'Lv.' + level;
  expBar.style.width    = pct + '%';
  expText.textContent   = level >= MAX_LEVEL ? 'MAX' : exp + ' / ' + needed;
  levelDisp.textContent = level >= MAX_LEVEL ? '👑' + level : level;
}

function addExp(hole) {
  exp += EXP_PER_HIT;
  const needed = expNeeded(level);

  // 경험치 팝업
  const ep = document.createElement('span');
  ep.className = 'exp-pop';
  ep.textContent = '+' + EXP_PER_HIT + 'exp';
  hole.appendChild(ep);
  setTimeout(() => ep.remove(), 600);

  // 레벨업 체크: 순수 경험치 방식 → 초과분 carry (최대 레벨 상한)
  while (level < MAX_LEVEL && exp >= expNeeded(level)) {
    exp -= expNeeded(level);
    level++;
    showLevelUpToast(level);
  }
  // 최대 레벨 도달 시 경험치 고정
  if (level >= MAX_LEVEL) {
    level = MAX_LEVEL;
    exp   = expNeeded(MAX_LEVEL); // 바 꽉 찬 상태 유지
  }

  saveProgress();
  updateExpUI();
}

function showLevelUpToast(lv) {
  toast.textContent = '⭐ LEVEL UP!  Lv.' + lv;
  toast.classList.remove('show');
  void toast.offsetWidth; // reflow
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1300);
}

// ── 게임 상태 ─────────────────────────────────────────────
let score = 0, combo = 1, timeLeft = TOTAL_TIME;
let running = false, moleTimer = null, countdownTimer = null;
let activeMoles = new Set();
let moleTimeouts = {};

const EMOJIS = ['🐭', '🦔', '🐾'];

function rnd(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }

function showMole() {
  if (!running) return;

  const available = holes.filter((h, i) => !activeMoles.has(i));
  if (available.length === 0) { moleTimer = setTimeout(showMole, 300); return; }

  const hole  = available[rnd(0, available.length - 1)];
  const idx   = parseInt(hole.dataset.i);
  const { durMin, durMax, intMin, intMax } = getSpeed();
  const dur   = rnd(durMin, durMax);
  const emoji = EMOJIS[rnd(0, EMOJIS.length - 1)];

  activeMoles.add(idx);
  hole.querySelector('.mole-emoji').textContent = emoji;
  hole.classList.add('active');

  moleTimeouts[idx] = setTimeout(() => {
    if (activeMoles.has(idx) && running) missHole(hole, idx);
  }, dur);

  moleTimer = setTimeout(showMole, rnd(intMin, intMax));
}

function hitHole(hole, idx) {
  if (!activeMoles.has(idx) || !running) return;
  clearTimeout(moleTimeouts[idx]);
  activeMoles.delete(idx);

  playHitSound();

  const pts = 10 * combo;
  score += pts;
  combo = Math.min(combo + 1, 5);
  scoreEl.textContent  = score;
  comboEl.textContent  = 'x' + combo;

  hole.querySelector('.mole-emoji').textContent = '💥';
  hole.classList.remove('active');
  hole.classList.add('hit');

  // 점수 팝업
  const pop = document.createElement('span');
  pop.className   = 'score-pop';
  pop.textContent = '+' + pts;
  hole.appendChild(pop);
  setTimeout(() => pop.remove(), 600);

  // 경험치 지급
  addExp(hole);

  resultEl.innerHTML = combo >= 3
    ? `🔥 <strong>${combo}콤보!</strong> +${pts}점`
    : `👊 잡았다! +${pts}점`;

  setTimeout(() => {
    hole.querySelector('.mole-emoji').textContent = '🕳️';
    hole.classList.remove('hit');
  }, 300);
}

function missHole(hole, idx) {
  activeMoles.delete(idx);
  playMissSound();
  hole.querySelector('.mole-emoji').textContent = '😤';
  hole.classList.remove('active');
  hole.classList.add('miss');
  combo = 1;
  comboEl.textContent = 'x1';

  setTimeout(() => {
    hole.querySelector('.mole-emoji').textContent = '🕳️';
    hole.classList.remove('miss');
  }, 400);
}

holes.forEach(hole => {
  hole.addEventListener('click', () => {
    hitHole(hole, parseInt(hole.dataset.i));
  });
});

function startGame() {
  getAudioCtx(); // 사용자 클릭 시점에 오디오 컨텍스트 활성화(브라우저 자동재생 정책 대응)
  score = 0; combo = 1; timeLeft = TOTAL_TIME;
  running = true;
  activeMoles.clear();
  Object.values(moleTimeouts).forEach(clearTimeout);
  moleTimeouts = {};

  scoreEl.textContent  = 0;
  comboEl.textContent  = 'x1';

  holes.forEach(h => {
    h.classList.remove('active', 'hit', 'miss');
    h.querySelector('.mole-emoji').textContent = '🕳️';
  });

  resultEl.innerHTML    = '두더지를 잡아라! 🔨';
  startBtn.textContent  = '진행 중';
  startBtn.disabled     = true;

  showMole();

  countdownTimer = setInterval(() => {
    timeLeft--;
    if (timeLeft <= 0) endGame();
  }, 1000);
}

function endGame() {
  running = false;
  clearTimeout(moleTimer);
  clearInterval(countdownTimer);
  Object.values(moleTimeouts).forEach(clearTimeout);
  activeMoles.clear();

  holes.forEach(h => {
    h.classList.remove('active');
    h.querySelector('.mole-emoji').textContent = '🕳️';
  });

  if (score > highScore) {
    highScore = score;
    saveProgress();
  }

  const msg = score >= 300 ? '🏆 완벽해요!' : score >= 150 ? '👍 잘했어요!' : '😅 다시 도전!';
  resultEl.innerHTML = `<strong>게임 종료!</strong> 최종 점수: <strong>${score}점</strong> &nbsp;|&nbsp; 최고기록: <strong>${highScore}점</strong> &nbsp; ${msg}`;

  startBtn.textContent = '다시 시작';
  startBtn.disabled    = false;
}

startBtn.addEventListener('click', startGame);

// 초기 UI
updateExpUI();
</script>

</body>
</html>
